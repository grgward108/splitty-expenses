openapi: 3.0.0
info:
  title: Splitty API
  version: 0.0.0
tags:
  - name: groups
  - name: members
  - name: expenses
  - name: balances
  - name: health
paths:
  /api/groups:
    post:
      operationId: Groups_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Group'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
  /api/groups/{groupId}:
    get:
      operationId: Groups_get
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Group'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - groups
  /api/groups/{groupId}/balances:
    get:
      operationId: Balances_get
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/BalanceSummary'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - balances
  /api/groups/{groupId}/expenses:
    get:
      operationId: Expenses_list
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PaginationQuery.page'
        - $ref: '#/components/parameters/PaginationQuery.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - items
                      - total
                      - page
                      - limit
                      - totalPages
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Expense'
                      total:
                        type: integer
                        format: int32
                      page:
                        type: integer
                        format: int32
                      limit:
                        type: integer
                        format: int32
                      totalPages:
                        type: integer
                        format: int32
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - expenses
    post:
      operationId: Expenses_create
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Expense'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
  /api/groups/{groupId}/expenses/{expenseId}:
    get:
      operationId: Expenses_get
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Expense'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - expenses
    put:
      operationId: Expenses_update
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Expense'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
    delete:
      operationId: Expenses_delete
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - expenses
  /api/groups/{groupId}/members:
    post:
      operationId: Members_add
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Member'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
  /api/groups/{groupId}/members/{memberId}:
    put:
      operationId: Members_update
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Member'
                  - $ref: '#/components/schemas/ErrorResponse'
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
    delete:
      operationId: Members_remove
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - members
  /api/health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  timestamp:
                    type: string
                    format: date-time
                required:
                  - status
                  - timestamp
      tags:
        - health
components:
  parameters:
    PaginationQuery.limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 10
      explode: false
    PaginationQuery.page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 1
      explode: false
  schemas:
    AddMemberRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        emoji:
          type: string
    Balance:
      type: object
      required:
        - memberId
        - memberName
        - memberEmoji
        - balance
      properties:
        memberId:
          type: string
        memberName:
          type: string
        memberEmoji:
          type: string
        balance:
          type: string
    BalanceSummary:
      type: object
      required:
        - balances
        - debts
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
        debts:
          type: array
          items:
            $ref: '#/components/schemas/Debt'
    CreateExpenseRequest:
      type: object
      required:
        - description
        - amount
        - paidByMemberId
        - splitType
        - splits
      properties:
        description:
          type: string
        amount:
          type: string
        paidByMemberId:
          type: string
        splitType:
          $ref: '#/components/schemas/SplitType'
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/CreateExpenseSplitInput'
    CreateExpenseSplitInput:
      type: object
      required:
        - memberId
        - amount
      properties:
        memberId:
          type: string
        amount:
          type: string
    CreateGroupRequest:
      type: object
      required:
        - name
        - members
      properties:
        name:
          type: string
        currency:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/CreateMemberInput'
    CreateMemberInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        emoji:
          type: string
    Debt:
      type: object
      required:
        - fromMemberId
        - fromMemberName
        - fromMemberEmoji
        - toMemberId
        - toMemberName
        - toMemberEmoji
        - amount
      properties:
        fromMemberId:
          type: string
        fromMemberName:
          type: string
        fromMemberEmoji:
          type: string
        toMemberId:
          type: string
        toMemberName:
          type: string
        toMemberEmoji:
          type: string
        amount:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
    Expense:
      type: object
      required:
        - id
        - groupId
        - description
        - amount
        - paidByMemberId
        - splitType
        - category
        - splits
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        groupId:
          type: string
        description:
          type: string
        amount:
          type: string
        paidByMemberId:
          type: string
        splitType:
          $ref: '#/components/schemas/SplitType'
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExpenseCategory:
      type: string
      enum:
        - food
        - transport
        - accommodation
        - entertainment
        - shopping
        - utilities
        - other
    ExpenseSplit:
      type: object
      required:
        - id
        - expenseId
        - memberId
        - amount
        - createdAt
      properties:
        id:
          type: string
        expenseId:
          type: string
        memberId:
          type: string
        amount:
          type: string
        createdAt:
          type: string
          format: date-time
    Group:
      type: object
      required:
        - id
        - name
        - currency
        - members
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        currency:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required:
        - id
        - groupId
        - name
        - emoji
        - createdAt
      properties:
        id:
          type: string
        groupId:
          type: string
        name:
          type: string
        emoji:
          type: string
        createdAt:
          type: string
          format: date-time
    SplitType:
      type: string
      enum:
        - equal
        - exact
    UpdateExpenseRequest:
      type: object
      properties:
        description:
          type: string
        amount:
          type: string
        paidByMemberId:
          type: string
        splitType:
          $ref: '#/components/schemas/SplitType'
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/CreateExpenseSplitInput'
    UpdateMemberRequest:
      type: object
      properties:
        name:
          type: string
        emoji:
          type: string
servers:
  - url: http://localhost:3000
    description: Development server
    variables: {}
