name = "monorepo-app"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# Serve the web SPA as static assets from the Worker
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Hyperdrive binding for PostgreSQL (via Drizzle)
# Create with: wrangler hyperdrive create monorepo-db --connection-string="postgres://..."
# Then paste the ID below
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-config-id>"

# Resend（@repo/email）: Workers ではシークレットとして注入する（wrangler.toml には書かない）
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_FROM_EMAIL   # 例: Monorepo <noreply@yourdomain.com>
#   または scripts/push-cloudflare-secrets.sh で一括（環境変数をセットしてから実行）

# --- Staging ---
[env.staging]
name = "monorepo-app-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "b08ba6bb33b44c64a7e090da677ae594"

# --- Production ---
[env.production]
name = "monorepo-app-production"
# [[env.production.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<production-hyperdrive-id>"
